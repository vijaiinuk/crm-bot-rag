[project]
name = "chatbot"
version = "0.1.0"
description = "RAG help chatbot for the CRM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "litellm>=1.109.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# Seeded pseudo-randomness simulates mock data; nothing security-relevant.
"src/chatbot/adapters/mock_admin/**" = ["S311"]
"src/chatbot/admin/{evals,insights}.py" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tools", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261103",
]
