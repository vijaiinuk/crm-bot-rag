# Model IDs, providers and routing. The only place model IDs live (CLAUDE.md).
#
# Rules (ADR-0002):
#   - pinned model versions only, never "latest" aliases
#   - OpenRouter routing pinned to the model vendor's own provider, no fallbacks,
#     so one model ID is never silently served by a different backend
#   - only synthetic docs and synthetic users go to OpenRouter
#
# Code asks for a model by role (e.g. `docgen`), never by ID.

providers:
  openrouter:
    api_base: https://openrouter.ai/api/v1

models:
  # S1.2.1: writes the synthetic doc bodies. S1.3.1's question generator must
  # use a different vendor.
  docgen:
    provider: openrouter
    model_id: anthropic/claude-sonnet-5.5
    route:
      order: [anthropic]
      allow_fallbacks: false
    params:
      temperature: 0.7
      max_tokens: 4000
    rpm: 18  # OpenRouter caps new accounts at 20 a minute per model

  # S1.3.1: writes the synthetic eval questions. A different vendor from
  # `docgen`, so questions don't echo the docs' own phrasing habits.
  questiongen:
    provider: openrouter
    model_id: openai/gpt-5.4-mini
    route:
      order: [openai]
      allow_fallbacks: false
    params:
      temperature: 1.0
      max_tokens: 2000
    rpm: 18  # OpenRouter caps new accounts at 20 a minute per model
