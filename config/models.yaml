# Model IDs, providers and routing. The only place model IDs live (CLAUDE.md).
#
# Rules (ADR-0002):
#   - pinned model versions only, never "latest" aliases
#   - OpenRouter routing pinned to the model vendor's own provider, no fallbacks,
#     so one model ID is never silently served by a different backend
#   - only synthetic docs and synthetic users go to OpenRouter
#
# Code asks for a model by role (e.g. `docgen`), never by ID.

providers:
  openrouter:
    api_base: https://openrouter.ai/api/v1

models:
  # S1.2.1: writes the synthetic doc bodies. S1.3.1's question generator must
  # use a different vendor.
  docgen:
    provider: openrouter
    model_id: anthropic/claude-sonnet-5.5
    route:
      order: [anthropic]
      allow_fallbacks: false
    params:
      temperature: 0.7
      max_tokens: 4000
    rpm: 18  # OpenRouter caps new accounts at 20 a minute per model

  # S1.3.1: writes the synthetic eval questions. A different vendor from
  # `docgen`, so questions don't echo the docs' own phrasing habits.
  questiongen:
    provider: openrouter
    model_id: openai/gpt-5.4-mini
    route:
      order: [openai]
      allow_fallbacks: false
    params:
      temperature: 1.0
      max_tokens: 2000
    rpm: 18  # OpenRouter caps new accounts at 20 a minute per model

# S2.1.3: local embeddings, run natively on MPS (never sent to a provider).
# Pinned to a Hugging Face commit; changing it re-embeds the whole corpus,
# because the embedding cache is keyed on model + revision.
embeddings:
  model_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  dim: 1024
  batch_size: 16

# S2.2.2: local cross-encoder, natively on MPS. The threshold is on this model's
# sigmoid score scale, so it lives here: a new model needs a new calibration.
reranker:
  model_id: BAAI/bge-reranker-v2-m3
  revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
  max_length: 512   # chunks are at most ~400 tokens, so nothing is truncated
  batch_size: 16
  dtype: float16    # MPS only: half the memory, scores within 0.001 of float32
  # Calibrated 2026-11-19 on the golden set (411 question x persona pairs), top
  # rerank score per pair. At 0.3: 8.7% of answerable pairs refused (many are
  # retrieval misses), 3.3% of nothing-to-find pairs answered, 16% of restricted
  # pairs answered from allowed content (partial access: see S3.1.3b).
  # Provisional: 60 negatives is a small sample; S2.3.1 re-checks it each run.
  threshold: 0.3
