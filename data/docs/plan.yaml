# The synthetic doc plan: what to write, before an LLM writes any of it.
#
# Hand-written and reviewed, like the spec. The generator (tools/docgen.py)
# writes each doc's body from `brief` and `sections`; everything evals and
# permissions depend on comes from here, never from the model:
#   - modules  -> frontmatter (rule 4: tags are never LLM-generated)
#   - headings -> anchors     (evals label `doc_id#anchor`; must be stable)
# A generated doc whose headings differ from its plan is rejected.
#
# Fields
#   kind:        module | workflow (workflow guides cover one spec workflow,
#                tagged with all of its modules)
#   brief:       what the doc covers; also tells the model what NOT to cover
#   sections:    heading (anchor = slug of the heading), level (2 default, 3),
#                steps (numbered procedure of about N steps), table, code
#   hard_cases:  near_duplicate | cross_reference | long_procedure |
#                code_block | table | multi_module
#   related:     doc_ids this one overlaps with or points to
# Files land at data/docs/<first module>/<doc_id>.md, or data/docs/workflows/.
plan_version: 1
seed: 20261113

